<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Đấu Trường Thú</title>
<style>
  :root { --ink: #1b1726; --panel: #1d2a4a; --panel2: #2b3d6b; --gold: #f2c14e; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0d1222; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #fff; user-select: none; }
  canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; image-rendering: pixelated; }
  .hidden { display: none !important; }
  /* message bubble */
  #msg { position: fixed; left: 12px; top: 12px; max-width: min(520px, 70vw); background: rgba(16, 22, 44, .86); border: 2px solid #7fa8ff; border-radius: 14px; padding: 9px 14px; font-weight: 700; font-size: 15px; box-shadow: 0 3px 0 var(--ink); }
  /* status cards */
  .card { position: fixed; min-width: 230px; background: linear-gradient(#24345e, #18223f); border: 2px solid var(--ink); border-radius: 10px; padding: 6px 10px 7px; box-shadow: 0 3px 0 rgba(0,0,0,.4); }
  .card .top { display: flex; align-items: center; gap: 6px; font-weight: 800; font-size: 14px; }
  .card .lv { margin-left: auto; color: var(--gold); font-size: 13px; }
  .chip { display: inline-block; padding: 1px 7px; border-radius: 9px; font-size: 11px; font-weight: 800; color: #fff; text-shadow: 0 1px 0 rgba(0,0,0,.4); }
  .bar { position: relative; height: 10px; margin-top: 5px; background: #0b1020; border: 2px solid var(--ink); border-radius: 6px; overflow: hidden; }
  .bar > i { position: absolute; inset: 0 auto 0 0; width: 100%; background: #4cd964; transition: width .45s, background .3s; }
  .card .hpt { font-size: 12px; margin-top: 3px; display: flex; justify-content: space-between; color: #cfe0ff; }
  .st { font-size: 11px; font-weight: 800; padding: 0 6px; border-radius: 7px; background: #555; }
  .dots { display: flex; gap: 4px; margin-top: 5px; }
  .dots b { width: 12px; height: 12px; transform: rotate(45deg); border: 2px solid var(--ink); background: var(--gold); border-radius: 3px; }
  .dots b.out { background: #555; }
  #ecard { right: 12px; top: 12px; }
  #pcard { left: 12px; bottom: 12px; }
  /* action panel */
  #panel { position: fixed; right: 12px; bottom: 12px; width: min(640px, calc(100vw - 280px)); }
  .tabs { display: flex; gap: 6px; margin-left: 10px; }
  .tab { background: linear-gradient(#3a5590, #263a66); border: 2px solid var(--ink); border-bottom: 0; border-radius: 10px 10px 0 0; padding: 6px 14px; font-weight: 800; font-size: 14px; cursor: pointer; color: #dfe8ff; }
  .tab.on { background: linear-gradient(#5b8ef0, #3a66c8); color: #fff; }
  .tab.red { background: linear-gradient(#c8505a, #8c2f39); }
  .box { background: linear-gradient(#2a4278, #1b2a50); border: 2px solid var(--ink); border-radius: 12px; padding: 8px; box-shadow: 0 3px 0 rgba(0,0,0,.45); }
  .moves { display: grid; grid-template-columns: repeat(4, 1fr); gap: 7px; }
  .mv { position: relative; border: 2px solid var(--ink); border-radius: 9px; padding: 6px 7px 5px; cursor: pointer; color: #fff; text-align: left; min-height: 66px; box-shadow: inset 0 -3px 0 rgba(0,0,0,.25); }
  .mv .n { font-weight: 800; font-size: 14px; text-shadow: 0 1px 0 rgba(0,0,0,.5); }
  .mv .pp { font-size: 11px; opacity: .9; margin-top: 2px; }
  .mv .ef { font-size: 11px; font-weight: 800; margin-top: 3px; }
  .mv[disabled], .mon[disabled] { filter: grayscale(.85) brightness(.7); cursor: default; }
  .team { display: grid; grid-template-columns: repeat(4, 1fr); gap: 7px; }
  .mon { border: 2px solid var(--ink); border-radius: 9px; background: #31477c; padding: 4px; cursor: pointer; text-align: center; color: #fff; }
  .mon .pic { width: 64px; height: 64px; margin: 0 auto; background-size: 400% 400%; background-position: 0 0; image-rendering: pixelated; }
  .mon .n { font-size: 12px; font-weight: 800; }
  .mon .bar { height: 7px; margin-top: 3px; }
  .mon.cur { outline: 3px solid var(--gold); }
  .confirm { display: flex; gap: 10px; align-items: center; justify-content: center; padding: 10px; font-weight: 700; }
  .btn { border: 2px solid var(--ink); border-radius: 10px; padding: 9px 18px; font-weight: 800; font-size: 15px; cursor: pointer; color: #fff; background: linear-gradient(#5b8ef0, #3a66c8); box-shadow: 0 3px 0 var(--ink); }
  .btn.red { background: linear-gradient(#e0606a, #a33842); }
  .btn.gold { background: linear-gradient(#f6d16a, #d79a2a); color: #3a2400; }
  /* side buttons */
  #side { position: fixed; left: 12px; top: 64px; display: flex; flex-direction: column; gap: 8px; }
  #side .btn { padding: 6px 10px; font-size: 13px; }
  #side .btn.on { background: linear-gradient(#f6d16a, #d79a2a); color: #3a2400; }
  /* overlays */
  .ov { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(6, 10, 24, .72); z-index: 5; }
  .ov .inner { background: linear-gradient(#24345e, #141c36); border: 3px solid var(--ink); border-radius: 16px; padding: 22px 26px; text-align: center; max-width: 92vw; box-shadow: 0 5px 0 var(--ink); }
  .ov h1 { margin: 0 0 6px; font-size: 26px; color: var(--gold); text-shadow: 0 2px 0 var(--ink); }
  .ov p { margin: 6px 0 14px; color: #cfe0ff; }
  .ov .row { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  @media (max-width: 760px), (max-height: 430px) {
    #msg { font-size: 13px; padding: 6px 10px; max-width: 58vw; }
    .card { min-width: 180px; padding: 4px 8px 5px; }
    .card .top { font-size: 12px; }
    #panel { width: min(560px, calc(100vw - 210px)); }
    .mv { min-height: 52px; padding: 4px 5px; }
    .mv .n { font-size: 12px; }
    .tab { padding: 4px 9px; font-size: 12px; }
    .mon .pic { width: 44px; height: 44px; }
  }
  @media (orientation: portrait) {
    #panel { left: 8px; right: 8px; width: auto; bottom: 8px; }
    #pcard { bottom: auto; top: 54vh; left: 8px; }
    .moves, .team { grid-template-columns: repeat(2, 1fr); }
  }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="msg">Đấu Trường Thú</div>
<div id="side" class="hidden">
  <button class="btn" id="spd">⏩ x2</button>
  <button class="btn" id="auto">🤖 Tự động</button>
</div>
<div class="card hidden" id="ecard"></div>
<div class="card hidden" id="pcard"></div>
<div id="panel" class="hidden">
  <div class="tabs">
    <div class="tab on" data-t="fight">⚔ Chiến đấu</div>
    <div class="tab" data-t="team">⇄ Đổi thú</div>
    <div class="tab red" data-t="quit">🏳 Đầu hàng</div>
  </div>
  <div class="box" id="pbody"></div>
</div>
<div class="ov" id="start">
  <div class="inner">
    <h1>Đấu Trường Thú</h1>
    <p>Bản thử: đấu theo lượt 1 chọi 1. Đội của bạn: Kỳ Nhông Lửa, Đảo Quy, Hiền Giả Sen, Sóc Bay Sấm.</p>
    <div class="row">
      <button class="btn gold" id="go-wild">🌿 Đấu thú hoang</button>
      <button class="btn" id="go-trainer">🧙 Đấu huấn luyện viên</button>
    </div>
  </div>
</div>
<div class="ov hidden" id="end"><div class="inner"><h1 id="end-t"></h1><p id="end-p"></p><div class="row"><button class="btn gold" id="again">Đấu lại</button></div></div></div>
<script type="module" src="arena.js"></script>
</body>
</html>
